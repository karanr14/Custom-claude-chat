<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Splitscreen Portal (Puter.js)</title>
    <!-- Puter.js SDK -->
    <script src="https://puter.com"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #fafafa; overflow: hidden; }
        
        /* Layout Grid */
        .workspace { display: flex; height: 100vh; width: 100vw; }
        
        /* Left Sidebar Controls */
        .control-panel { width: 350px; background: white; padding: 25px; border-right: 2px solid #e5e7eb; display: flex; flex-direction: column; justify-content: flex-start; z-index: 10; }
        h2 { margin-top: 0; color: #d97706; font-size: 20px; }
        label { font-weight: bold; font-size: 13px; color: #4b5563; margin-bottom: 6px; display: block; }
        select, textarea { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; }
        textarea { height: 150px; resize: none; }
        button { background: #d97706; color: white; border: none; padding: 14px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background: #b45309; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        
        /* Dynamic Cost Alert Box */
        .cost-warning { display: none; background: #fffbeb; border: 1px solid #fef3c7; color: #b45309; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; font-weight: 500; }
        
        .instructions { margin-top: 30px; font-size: 12px; color: #6b7280; line-height: 1.5; padding: 12px; background: #f3f4f6; border-radius: 6px; }
        
        /* Right AI Screen Container */
        .ai-frame-container { flex-grow: 1; height: 100%; background: #fff; position: relative; overflow-y: auto; padding: 25px; }
        .placeholder-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #9ca3af; font-size: 16px; text-align: center; width: 80%; pointer-events: none; }
        
        /* Output Text Box */
        #aiOutput { display: none; white-space: pre-wrap; font-size: 15px; line-height: 1.6; color: #1f2937; }
    </style>
</head>
<body>

    <div class="workspace">
        <!-- Left Side Controller -->
        <div class="control-panel">
            <h2>AI Workspace</h2>
            <p style="font-size: 13px; color:#666; margin-top:-5px; margin-bottom:20px;">Powered by Puter.js</p>
            
            <label for="modelSelect">Select Model:</label>
            <select id="modelSelect" onchange="checkModelCost()">
                <option value="google/gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
                <option value="meta-llama/llama-3-8b-instruct:free">Llama 3 8B (100% Free Fallback)</option>
            </select>

            <!-- Cost Warning Banner -->
            <div id="costWarning" class="cost-warning"></div>

            <label for="promptInput">Type Your AI Prompt:</label>
            <textarea id="promptInput" placeholder="Ask AI to generate a website layout, write complex scripts, explain theory..."></textarea>
            
            <button id="submitBtn" onclick="sendToAI()">Generate AI Stream</button>
            
            <div class="instructions">
                <strong>💡 Safeguards Active:</strong><br>
                Expensive variants (Opus, Fable) are filtered automatically to protect your 1,000 credit allowance.
            </div>
        </div>

        <!-- Right Side AI Output Window -->
        <div class="ai-frame-container">
            <div id="fallbackMessage" class="placeholder-text">
                Your direct AI output workspace will render here instantly when you submit your prompt.
            </div>
            <div id="aiOutput"></div>
        </div>
    </div>

    <script>
        // 🛠️ DEVELOPER TESTING CONTROLS
        // Set this to true to see dummy text and completely freeze your token/limit usage!
        const IS_MOCK_MODE = false; 

        // Trigger loading models safely when window builds
        window.addEventListener('DOMContentLoaded', loadModels);

        async function loadModels() {
            const selectEl = document.getElementById('modelSelect');
            try {
                if (IS_MOCK_MODE) return;

                const models = await puter.ai.listModels();
                selectEl.innerHTML = ''; 

                if (!models || models.length === 0) {
                    selectEl.innerHTML = '<option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>';
                    return;
                }

                models.forEach(m => {
                    const modelId = m.id.toLowerCase();
                    
                    // 🛡️ WORKAROUND 1: Filter out heavy credit-draining premium tiers completely
                    if (modelId.includes('opus') || modelId.includes('fable') || modelId.includes('gpt-4-turbo')) {
                        console.log(`Skipped heavy model to save credits: ${m.id}`);
                        return; 
                    }

                    const option = document.createElement('option');
                    option.value = m.id;
                    option.textContent = m.name ? `${m.name} (${m.id})` : m.id;
                    
                    // Set cheap, fast Gemini 2.5 Flash as the standard default
                    if (m.id === 'google/gemini-2.5-flash') {
                        option.selected = true;
                    }
                    selectEl.appendChild(option);
                });

                // Inject a guaranteed unmetered tier to the bottom
                const freeOption = document.createElement('option');
                freeOption.value = "meta-llama/llama-3-8b-instruct:free";
                freeOption.textContent = "Llama 3 8B (100% Free OpenRouter Tier)";
                selectEl.appendChild(freeOption);

                // Run an initial check on the default selected model
                checkModelCost();

            } catch (err) {
                console.error('Failed to load Puter models:', err);
            }
        }

        // 🛡️ WORKAROUND 2: Display dynamic alert if a moderately premium model is highlighted
        function checkModelCost() {
            const selectEl = document.getElementById('modelSelect');
            const warningEl = document.getElementById('costWarning');
            const selectedModel = selectEl.value.toLowerCase();

            // Check if it's a paid tier model (e.g. standard Claude Sonnet or GPT-4o)
            if ((selectedModel.includes('claude') || selectedModel.includes('gpt')) && !selectedModel.includes('free')) {
                warningEl.style.display = "block";
                warningEl.innerHTML = "⚠️ <strong>Premium Model Selected:</strong> This request consumes high credits. Use a free fallback model to preserve your remaining credits.";
            } else {
                warningEl.style.display = "none";
            }
        }

        async function sendToAI() {
            const promptValue = document.getElementById('promptInput').value.trim();
            let selectedModel = document.getElementById('modelSelect').value;
            const outputDiv = document.getElementById('aiOutput');
            const placeholder = document.getElementById('fallbackMessage');
            const button = document.getElementById('submitBtn');

            if (!promptValue) {
                alert("Please enter a question or prompt inside the text box first!");
                return;
            }

            placeholder.style.display = "none";
            outputDiv.style.display = "block";
            outputDiv.innerText = "AI is thinking...";
            button.disabled = true;
            button.innerText = "Generating...";

            if (IS_MOCK_MODE) {
                setTimeout(() => {
                    outputDiv.innerHTML = `<strong>[MOCK MODE ACTIVE]</strong><br><br>Local testing layout response for prompt: "<em>${promptValue}</em>" via <code>${selectedModel}</code>.`;
                    button.disabled = false;
                    button.innerText = "Generate AI Stream";
                }, 800);
                return;
            }

            try {
                const response = await puter.ai.chat(promptValue, { 
                    model: selectedModel
                });
                
                // Clean response object text extraction
                let textContent = "";
                if (typeof response === 'string') {
                    textContent = response;
                } else if (response && response.message && typeof response.message.content === 'string') {
                    textContent = response.message.content;
                } else if (response && response.text) {
                    textContent = response.text;
                } else if (response && response.message && Array.isArray(response.message.content)) {
                    textContent = response.message.content
                        .map(block => block.text || "")
                        .join("");
                } else {
                    textContent = JSON.stringify(response);
                }

                outputDiv.innerText = textContent;

            } catch (err) {
                console.error('AI Processing Error:', err);
                outputDiv.innerHTML = `<span style="color: red; font-weight: bold;">Usage Error:</span> ${err.message || "Failed to complete request. Please switch to the Llama 3 Free Fallback."}`;
            } finally {
                button.disabled = false;
                button.innerText = "Generate AI Stream";
            }
        }
    </script>
</body>
</html>
