<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puter.js To-Do Application</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Puter.js SDK -->
  <script src="https://js.puter.com/v2/"></script>
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 flex justify-center">
  <div class="max-w-2xl w-full">
    <!-- App Header -->
    <header class="flex justify-between items-center mb-6 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
      <div>
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 flex items-center gap-3">
          <i class="fa-solid fa-list-check text-blue-400"></i> Cloud Tasks
        </h1>
        <p class="text-slate-400 text-sm mt-1">Backed by Puter.js Key-Value Storage</p>
      </div>
      <div id="sync-status" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        Connecting...
      </div>
    </header>

    <!-- Main Card -->
    <main class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
      <!-- Input Form -->
      <form id="todo-form" class="flex flex-col sm:flex-row gap-3 mb-6">
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
          required
          class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
        />
        <select
          id="priority-select"
          class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button
          type="submit"
          class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-plus"></i> Add
        </button>
      </form>

      <!-- Filter Controls & Counter -->
      <div class="flex flex-wrap items-center justify-between gap-4 pb-6 mb-6 border-b border-slate-700">
        <div class="flex gap-2">
          <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white">All</button>
          <button data-filter="active" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 hover:bg-slate-600">Active</button>
          <button data-filter="completed" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 hover:bg-slate-600">Completed</button>
        </div>
        <div class="text-sm text-slate-400 font-medium" id="task-counter">0 tasks remaining</div>
      </div>

      <!-- Task List -->
      <ul id="task-list" class="space-y-3 min-h-[120px]"></ul>

      <!-- Footer Actions -->
      <div class="mt-6 pt-4 border-t border-slate-700 flex justify-between items-center text-xs text-slate-400">
        <button id="clear-completed" class="hover:text-red-400 transition-colors flex items-center gap-1.5">
          <i class="fa-solid fa-trash-can"></i> Clear Completed
        </button>
        <span>Storage: Puter KV</span>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'puter_todo_tasks_v1';
    let tasks = [];
    let currentFilter = 'all';

    const form = document.getElementById('todo-form');
    const taskInput = document.getElementById('task-input');
    const prioritySelect = document.getElementById('priority-select');
    const taskList = document.getElementById('task-list');
    const syncStatus = document.getElementById('sync-status');
    const taskCounter = document.getElementById('task-counter');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // Initialize & Fetch Tasks from Puter Cloud Storage
    async function init() {
      updateSyncStatus('connecting', 'Connecting...');
      try {
        const cloudData = await puter.kv.get(STORAGE_KEY);
        if (cloudData) {
          tasks = typeof cloudData === 'string' ? JSON.parse(cloudData) : cloudData;
        } else {
          tasks = [];
        }
        updateSyncStatus('connected', 'Cloud Synced');
      } catch (err) {
        console.warn('Puter KV unavailable, falling back to LocalStorage:', err);
        const localData = localStorage.getItem(STORAGE_KEY);
        if (localData) tasks = JSON.parse(localData);
        updateSyncStatus('offline', 'Local Storage');
      }
      render();
    }

    // Save Tasks to Puter KV Store
    async function saveTasks() {
      updateSyncStatus('saving', 'Syncing...');
      try {
        await puter.kv.set(STORAGE_KEY, JSON.stringify(tasks));
        updateSyncStatus('connected', 'Cloud Synced');
      } catch (err) {
        console.error('Failed to save to Puter KV:', err);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        updateSyncStatus('offline', 'Saved Locally');
      }
    }

    function updateSyncStatus(state, message) {
      if (state === 'connecting' || state === 'saving') {
        syncStatus.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20';
        syncStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> ${message}`;
      } else if (state === 'connected') {
        syncStatus.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
        syncStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ${message}`;
      } else {
        syncStatus.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-700 text-slate-400 border border-slate-600';
        syncStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-500"></span> ${message}`;
      }
    }

    // Handle Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      const newTask = {
        id: Date.now().toString(),
        text,
        priority: prioritySelect.value,
        completed: false
      };

      tasks.unshift(newTask);
      taskInput.value = '';
      render();
      await saveTasks();
    });

    // Toggle Task Completion
    window.toggleTask = async function(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      render();
      await saveTasks();
    };

    // Delete Task
    window.deleteTask = async function(id) {
      tasks = tasks.filter(t => t.id !== id);
      render();
      await saveTasks();
    };

    // Clear Completed Tasks
    clearCompletedBtn.addEventListener('click', async () => {
      tasks = tasks.filter(t => !t.completed);
      render();
      await saveTasks();
    });

    // Handle Filters
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.className = 'filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 hover:bg-slate-600';
        });
        btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white';
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    function getPriorityBadge(priority) {
      const config = {
        high: 'bg-red-500/10 text-red-400 border-red-500/20',
        medium: 'bg-amber-500/10 text-amber-400 border-amber-500/20',
        low: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
      };
      return `<span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded border ${config[priority]}">${priority}</span>`;
    }

    function render() {
      const filtered = tasks.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true;
      });

      const activeCount = tasks.filter(t => !t.completed).length;
      taskCounter.textContent = `${activeCount} ${activeCount === 1 ? 'task' : 'tasks'} remaining`;

      if (filtered.length === 0) {
        taskList.innerHTML = `
          <li class="text-center py-10 text-slate-500">
            <i class="fa-regular fa-clipboard text-3xl mb-2 block"></i>
            No tasks found
          </li>
        `;
        return;
      }

      taskList.innerHTML = filtered.map(task => `
        <li class="group flex items-center justify-between p-3.5 bg-slate-900/60 rounded-xl border border-slate-700/60 hover:border-slate-600 transition-all ${task.completed ? 'opacity-60' : ''}">
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <button onclick="toggleTask('${task.id}')" class="w-5 h-5 rounded-md border flex items-center justify-center transition-all ${task.completed ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-600 hover:border-blue-400'}">
              ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
            </button>
            <span class="truncate text-slate-200 ${task.completed ? 'line-through text-slate-500' : ''}">
              ${escapeHtml(task.text)}
            </span>
            ${getPriorityBadge(task.priority)}
          </div>
          <button onclick="deleteTask('${task.id}')" class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1 ml-2">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    init();
  </script>
</body>
</html>
